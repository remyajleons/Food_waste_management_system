{% extends 'donarbase.html' %}
{% block content %}

<head>
    <title>Payment</title>
    <style>
        body{font-family:Arial;background:#f4f6f8;text-align:center;}
        .box{background:white;width:400px;margin:40px auto;padding:25px;border-radius:10px;}
        input{width:90%;padding:10px;margin:10px;border:1px solid #ccc;border-radius:5px;}
        button{padding:10px 20px;background:#28a745;color:white;border:none;border-radius:5px;}
        .error{color:red;font-size:13px;}
    </style>
</head>

<div class="box">
    <h2>Payment for {{ claim.foodName }}</h2>

    <form method="POST" onsubmit="return validatePaymentForm()">
        {% csrf_token %}

        <input type="number" name="amount" id="amount"
               placeholder="Enter Amount" min="1" required>

        <input type="text" name="card_number" id="card_number"
               placeholder="Card Number (16 digits)"
               maxlength="16" required>

        <input type="text" name="expiry" id="expiry"
               placeholder="MM/YY" maxlength="5" required>

        <input type="text" name="cvv" id="cvv"
               placeholder="CVV" maxlength="3" required>

        <div id="error" class="error"></div>

        <button type="submit">Pay Now</button>
    </form>
</div>

<script>
function validatePaymentForm(){
    let card = document.getElementById("card_number").value;
    let expiry = document.getElementById("expiry").value;
    let cvv = document.getElementById("cvv").value;
    let amount = document.getElementById("amount").value;
    let error = document.getElementById("error");

    // Clear old error
    error.innerHTML = "";

    // Card number validation (16 digits)
    if(!/^\d{16}$/.test(card)){
        error.innerHTML = "Card number must be 16 digits.";
        return false;
    }

    // Expiry validation MM/YY
    if(!/^(0[1-9]|1[0-2])\/\d{2}$/.test(expiry)){
        error.innerHTML = "Expiry must be in MM/YY format.";
        return false;
    }

    // CVV validation (3 digits)
    if(!/^\d{3}$/.test(cvv)){
        error.innerHTML = "CVV must be 3 digits.";
        return false;
    }

    // Amount validation
    if(amount <= 0){
        error.innerHTML = "Enter valid amount.";
        return false;
    }

    return true;
}
</script>

{% endblock content %}
